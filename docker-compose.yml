services:
  bosarsalog:
    build: .
    container_name: bosarsalog
    restart: unless-stopped
    ports:
      - "127.0.0.1:3416:3000"
    volumes:
      - bosarsalog-data:/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/bosarsalog.db
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://bosarsalog.oeradio.at}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/auth/login", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cloudflared-tunnel

volumes:
  bosarsalog-data:
    driver: local

networks:
  cloudflared-tunnel:
    external: true
